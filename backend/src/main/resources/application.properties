spring.application.name=PersoNotes
server.port=${PORT:8080}
secretString=${JWT_SECRET:mySuperSecretKeyForPersoNotesApplication2026!}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:personotesdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
note.encryption.secret=${NOTE_ENCRYPTION_SECRET:PersoNotesSecretEncryptionKey2026MasterKey!}

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# Gmail SMTP Configuration (No domain required)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Resend API Configuration (Optional alternative)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:PersoNotes <onboarding@resend.dev>}