spring.application.name=PersoNotes
server.port=${PORT:8080}
secretString=${JWT_SECRET:mySuperSecretKeyForPersoNotesApplication2026!}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:personotesdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}